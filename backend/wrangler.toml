name = "worktrack-api"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Containers configuration (runs the Express + Mongoose Node.js server on Cloudflare)
# Requires Cloudflare Workers Paid plan. Deploy with: npx wrangler deploy
[[containers]]
name = "worktrack-backend-container"
image = "./Dockerfile"
max_instances = 2
instance_type = "basic"

[vars]
NODE_ENV = "production"
PORT = "5000"
USE_IN_MEMORY_DB = "false"
JWT_EXPIRES_IN = "7d"
COOKIE_NAME = "worktrack_token"
